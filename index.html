<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Drop Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <aside class="nameplate">
        <img src="img/cw_logo-horizontal.png" alt="charity: water logo" class="nameplate-logo">
    </aside>

    <main class="game-wrapper">
        <div class="page-grid">
            <aside class="control-card">
                <div>
                    <h1 class="game-title">Water Game</h1>
                    <p class="game-tagline">Catch every falling drop to help water reach people who need it most.</p>
                </div>
                <div class="hud-panel">
                    <div class="hud-item"><span>Score:</span> <strong id="score">0</strong></div>
                    <div class="hud-item"><span>Time:</span> <strong id="time">30</strong>s</div>
                </div>
                <div class="button-group">
                    <button id="start-btn" class="action-btn">Play</button>
                    <button id="restart-btn" class="action-btn" type="button">Restart</button>
                </div>
            </aside>

            <div class="game-card">
                <div class="game-frame">
                    <div id="game-container" class="game-stage"></div>
                </div>
                <div id="result-message" class="result-message" aria-live="polite"></div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
